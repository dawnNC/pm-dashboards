<style>
  :root {
    --teal: #10A4D1;
    --dark-teal: #147878;
    --navy: #0F2747;
    --page-bg: #F0F3F7;
    --card-bg: #FFFFFF;
    --border: #E3E8EE;
    --border-2: #E9EEF3;
    --text-primary: #1A222A;
    --text-secondary: #6B7A8D;
    --text-muted: #9BA5B0;
    --text-muted-2: #A0AABB;
    --gold: #C9A227;
    --orange: #E8722E;
    --green: #1F8A70;
    --onhold-bg: #FCF3DD;
    --onhold-text: #9A6A00;
    --alt-row: #EDF4F7;
    --active-filter-bg: #EBF7FC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', Arial, 'Helvetica Neue', sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- PM nav bar (back to hub) ---------- */
  .pmnav-bar {
    height: 40px; background: #fff; border-bottom: 1.5px solid #E2E8F0;
    display: flex; align-items: center; padding: 0 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .pmnav-wordmark {
    font-size: 13px; font-weight: 800; color: var(--teal);
    text-decoration: none; letter-spacing: -0.2px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pmnav-wordmark:hover { text-decoration: underline; }
  .pmnav-wordmark .chev { font-size: 15px; line-height: 1; }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 56px; background: var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; color: #fff;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .topbar-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.22); }
  .report-title { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .topbar-right { display: flex; align-items: center; gap: 18px; }
  .sync-block { text-align: right; line-height: 1.35; }
  .sync-line { font-size: 11px; color: rgba(255,255,255,0.55); }
  .viewed-line { font-size: 10px; color: rgba(255,255,255,0.3); }
  .topbar-actions { display: flex; gap: 8px; }
  .tb-btn {
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    border-radius: 7px; font-size: 13px; font-family: inherit; font-weight: 600;
    padding: 7px 13px; cursor: pointer; transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.22); }

  /* ---------- Filter bar ---------- */
  .filterbar {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 8px 32px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 50; flex-wrap: wrap;
  }
  .filter-label { font-size: 11px; font-weight: 700; color: var(--text-muted-2); text-transform: uppercase; letter-spacing: 0.05em; }
  .clear-all { color: var(--teal); font-size: 12px; font-weight: 600; cursor: pointer; background: none; border: none; font-family: inherit; }
  .project-count { margin-left: auto; font-size: 13px; color: var(--text-secondary); }

  /* Multi-select dropdown */
  .ms { position: relative; }
  .ms-trigger {
    border: 1px solid #D8DEE6; background: #fff; border-radius: 8px;
    padding: 7px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 8px; color: var(--text-primary);
    transition: all 0.12s; white-space: nowrap;
  }
  .ms-trigger .caret { font-size: 10px; color: var(--text-muted); }
  .ms.active .ms-trigger { border-color: var(--teal); background: var(--active-filter-bg); color: var(--teal); font-weight: 600; }
  .ms.active .ms-trigger .caret { color: var(--teal); }
  .ms-q { min-width: 140px; }
  .ms-p { min-width: 175px; }
  .ms-s { min-width: 162px; }
  .ms-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: #fff; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    max-height: 280px; overflow-y: auto; z-index: 100; min-width: 100%; padding: 6px 0;
  }
  .ms.open .ms-panel { display: block; }
  .ms-opt {
    display: flex; align-items: center; gap: 9px; padding: 7px 14px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .ms-opt:hover { background: #F7FAFC; }
  .ms-opt.all { font-weight: 600; }
  .ms-sep { height: 1px; background: #F0F3F7; margin: 4px 0; }
  .ms-opt input { accent-color: var(--teal); width: 15px; height: 15px; cursor: pointer; }

  /* ---------- Tab bar ---------- */
  .tabbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; gap: 4px; }
  .tab {
    padding: 13px 16px; font-size: 14px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; border: none; background: none; font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { font-weight: 700; color: var(--navy); border-bottom-color: var(--teal); }

  /* ---------- Page ---------- */
  .page { padding: 28px 32px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .tab-panel { animation: fadeUp 0.18s ease; }
  .hidden { display: none !important; }

  .section-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 12px;
  }

  /* Summary cards */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .sum-card {
    background: #fff; border: 1px solid var(--border); border-radius: 2px 2px 10px 10px;
    padding: 28px 20px 22px; text-align: center; position: relative; overflow: hidden;
  }
  .sum-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); }
  .sum-num { font-size: 58px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); line-height: 1; }
  .sum-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 12px; }

  /* Status mix bar */
  .mix-section { margin-bottom: 32px; }
  .mix-bar { height: 52px; border-radius: 4px; overflow: hidden; display: flex; gap: 2px; }
  .mix-seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 700; min-width: 0; transition: flex 0.2s; }
  .mix-legend { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 14px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4A5568; }
  .legend-sq { width: 14px; height: 14px; border-radius: 2px; }

  /* By quarter + callouts */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  .quarter-tiles { display: flex; flex-wrap: wrap; gap: 12px; }
  .q-tile { background: var(--teal); border-radius: 10px; padding: 18px 24px; min-width: 100px; text-align: center; }
  .q-count { font-size: 44px; font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1; }
  .q-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-top: 6px; }

  .callout-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; }
  .callout-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .callout-head .section-label { margin-bottom: 0; }
  .callout-actions { display: flex; align-items: center; gap: 12px; }
  .link-btn { font-size: 11px; color: var(--text-muted); background: none; border: none; cursor: pointer; font-family: inherit; }
  .link-btn.teal { color: var(--teal); font-weight: 600; }
  .callout-list { list-style: disc; padding-left: 20px; margin-top: 12px; }
  .callout-list li { font-size: 14px; line-height: 1.7; color: var(--text-primary); }
  .callout-edit { display: none; margin-top: 12px; }
  .callout-edit textarea { width: 100%; height: 110px; border-radius: 8px; border: 1px solid #D8DEE6; padding: 10px 12px; font-family: inherit; font-size: 14px; line-height: 1.6; resize: vertical; }
  .callout-edit-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-save { background: var(--teal); color: #fff; border: none; border-radius: 7px; padding: 7px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-cancel { background: none; border: 1px solid #D8DEE6; color: var(--text-secondary); border-radius: 7px; padding: 7px 16px; font-size: 13px; font-family: inherit; cursor: pointer; }

  /* Product breakdown */
  .products { display: flex; flex-direction: column; gap: 36px; }
  .product-name { font-size: 12px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
  table.pb { width: 100%; border-collapse: collapse; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-radius: 8px; overflow: hidden; }
  table.pb thead th { background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 10px 12px; text-align: center; }
  table.pb thead th.col-project { text-align: left; }
  table.pb tbody tr { border-bottom: 1px solid var(--border-2); }
  table.pb tbody tr:nth-child(odd) { background: #fff; }
  table.pb tbody tr:nth-child(even) { background: var(--alt-row); }
  td.c-project { font-size: 14px; color: var(--text-primary); padding: 10px 14px; }
  td.c-project a.proj-link { color: var(--text-primary); text-decoration: none; }
  td.c-project a.proj-link:hover { color: var(--teal); text-decoration: underline; }
  td.c-size { font-size: 13px; font-weight: 600; color: #4A5568; text-align: center; width: 70px; }
  td.c-target { font-size: 13px; font-weight: 500; color: var(--teal); text-align: center; width: 110px; }
  td.c-status { padding: 7px 10px; text-align: center; width: 170px; }
  .badge { display: inline-block; padding: 5px 10px; font-size: 12px; font-weight: 700; border-radius: 4px; width: 150px; text-align: center; box-sizing: border-box; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); font-size: 15px; }

  /* Print */
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .page { padding: 12px 0; }
    .product-section.print-break { page-break-before: always; }
    .sum-card, .callout-card, table.pb { box-shadow: none; }
  }
</style>
</head>

  "Aline CRM", "Aline CRM (SNF)", "Aline CRM (PCS)", "Aline Clinical",
  "Leasing & Billing", "Integrations", "Compass", "Engage",
  "Analytics/BI/DBA", "AI"

  "Backlog", "Under Consideration", "Planned", "Requirements", "UI/UX Design",
  "In Development", "In Testing", "Ready to Deploy", "Deployed"
];

// Badge fill/text per status (phase palette from the style guide)
const STATUS_META = {
  "Backlog":            { fill: "#0F2747", text: "#FFFFFF" },
  "Under Consideration":{ fill: "#0F2747", text: "#FFFFFF" },
  "Planned":            { fill: "#0F2747", text: "#FFFFFF" },
  "Requirements":       { fill: "#147878", text: "#FFFFFF" },
  "UI/UX Design":       { fill: "#147878", text: "#FFFFFF" },
  "In Development":     { fill: "#147878", text: "#FFFFFF" },
  "In Testing":         { fill: "#147878", text: "#FFFFFF" },
  "Ready to Deploy":    { fill: "#1F8A70", text: "#FFFFFF" },
  "Deployed":           { fill: "#1F8A70", text: "#FFFFFF" },
};
function statusMeta(status) {
  return STATUS_META[status] || { fill: "#9BA5B0", text: "#FFFFFF" };
}

// Dashboard buckets: roll up statuses for cards + mix bar
const BUCKETS = [
  { key: "in_progress",  label: "In Progress",          color: "#10A4D1", statuses: ["Requirements", "UI/UX Design", "In Development", "In Testing"] },
  { key: "committed",    label: "Committed / Released",  color: "#147878", statuses: ["Ready to Deploy", "Deployed"] },
  { key: "under_review", label: "Under Review",          color: "#C9A227", statuses: ["Under Consideration", "Planned"] },
  { key: "early",        label: "Early / Backlog",       color: "#1A2947", statuses: ["Backlog"] },
];
function bucketOf(status) {
  const b = BUCKETS.find(b => b.statuses.includes(status));
  return b ? b.key : "under_review";
}

/* ---------- Helpers ---------- */
function dateToQuarter(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const q = Math.floor(d.getUTCMonth() / 3) + 1;
  return `Q${q} ${d.getUTCFullYear()}`;
}

/* ---------- State ---------- */

const ALL_PRODUCTS = PRODUCT_ORDER.filter(p => DATA.some(d => d.product === p));
const ALL_STATUSES = STATUS_ORDER.filter(s => DATA.some(d => d.status === s));

const state = {
  tab: "dashboard",
  quarters: new Set(),   // empty = all (within scope)
  products: new Set(),
  statuses: new Set(),
  customCallouts: null,
};

function getFiltered() {
  return DATA.filter(d => {
    if (state.quarters.size && !d.wq.some(q => state.quarters.has(q))) return false;
    if (state.products.size && !state.products.has(d.product)) return false;
    if (state.statuses.size && !state.statuses.has(d.status)) return false;
    return true;
  });
}
function anyFilterActive() {
  return state.quarters.size || state.products.size || state.statuses.size;
}

/* ============================================================
   Multi-select dropdown
   ============================================================ */
function buildMultiSelect(el, title, options, selectedSet) {
  function label() {
    if (selectedSet.size === 0) return `All ${title}`;
    if (selectedSet.size === 1) return [...selectedSet][0];
    return `${selectedSet.size} ${title}`;
  }
  function render() {
    el.classList.toggle("active", selectedSet.size > 0);
    el.innerHTML = `
      <button class="ms-trigger" type="button">
        <span>${label()}</span><span class="caret">▾</span>
      </button>
      <div class="ms-panel">
        <label class="ms-opt all">
          <input type="checkbox" ${selectedSet.size === 0 ? "checked" : ""} data-all="1" />
          <span>All ${title}</span>
        </label>
        <div class="ms-sep"></div>
        ${options.map(o => `
          <label class="ms-opt">
            <input type="checkbox" value="${o.replace(/"/g, "&quot;")}" ${selectedSet.has(o) ? "checked" : ""} />
            <span>${o}</span>
          </label>`).join("")}
      </div>`;

    el.querySelector(".ms-trigger").onclick = (e) => {
      e.stopPropagation();
      const wasOpen = el.classList.contains("open");
      closeAllDropdowns();
      if (!wasOpen) el.classList.add("open");
    };
    el.querySelectorAll(".ms-panel input").forEach(inp => {
      inp.onclick = (e) => e.stopPropagation();
      inp.onchange = () => {
        if (inp.dataset.all) selectedSet.clear();
        else if (inp.checked) selectedSet.add(inp.value);
        else selectedSet.delete(inp.value);
        render();
        onFilterChange();
      };
    });
    el.querySelector(".ms-panel").onclick = (e) => e.stopPropagation();
  }
  render();
}
function closeAllDropdowns() {
  document.querySelectorAll(".ms.open").forEach(el => el.classList.remove("open"));
}
document.addEventListener("click", closeAllDropdowns);

/* ============================================================
   Renderers
   ============================================================ */
function renderSummaryCards(filtered) {
  const total = filtered.length;
  const committed = filtered.filter(d => ["in_progress", "committed"].includes(bucketOf(d.status))).length;
  const underReview = filtered.filter(d => bucketOf(d.status) === "under_review").length;
  const early = filtered.filter(d => bucketOf(d.status) === "early").length;

  const cards = [
    { label: "Active Projects", num: total, accent: "#10A4D1" },
    { label: "Committed / In Progress", num: committed, accent: "#10A4D1" },
    { label: "Under Review", num: underReview, accent: "#C9A227" },
    { label: "Early / Backlog", num: early, accent: "#9BA5B0" },
  ];
  document.getElementById("summaryGrid").innerHTML = cards.map(c => `
    <div class="sum-card" style="--accent:${c.accent}">
      <div class="sum-num">${c.num}</div>
      <div class="sum-label">${c.label}</div>
    </div>`).join("");
}

function renderStatusMix(filtered) {
  const counts = BUCKETS.map(b => ({
    ...b,
    count: filtered.filter(d => bucketOf(d.status) === b.key).length
  }));

  const qLabel = state.quarters.size
    ? [...state.quarters].join(" / ")
    : "Q3 2026 / Q4 2026";
  document.getElementById("mixLabel").textContent = `Delivery Status Mix (${qLabel})`;

  document.getElementById("mixBar").innerHTML = counts
    .filter(b => b.count > 0)
    .map(b => `<div class="mix-seg" style="flex:${b.count};background:${b.color}" title="${b.label}: ${b.count}">${b.count}</div>`)
    .join("");

  document.getElementById("mixLegend").innerHTML = counts.map(b => `
    <div class="legend-item">
      <span class="legend-sq" style="background:${b.color}"></span>
      <span>${b.label} (${b.count})</span>
    </div>`).join("");
}

function renderByQuarter(filtered) {
  document.getElementById("quarterTiles").innerHTML = SCOPE_QUARTERS.map(q => {
    const count = filtered.filter(d => d.wq.includes(q)).length;
    return `
      <div class="q-tile">
        <div class="q-count">${count}</div>
        <div class="q-label">${q} Projects</div>
      </div>`;
  }).join("");
}

function generateCallouts(filtered) {
  const out = [];
  const total = filtered.length;
  if (!total) return ["No projects match the current filters."];

  const byProduct = {};
  filtered.forEach(d => byProduct[d.product] = (byProduct[d.product] || 0) + 1);
  const topProduct = Object.entries(byProduct).sort((a, b) => b[1] - a[1])[0];
  out.push(`${topProduct[0]} is the largest program with ${topProduct[1]} project${topProduct[1] > 1 ? "s" : ""} in scope.`);

  const inProg = filtered.filter(d => bucketOf(d.status) === "in_progress").length;
  if (inProg) out.push(`${inProg} project${inProg > 1 ? "s are" : " is"} actively in progress (requirements through testing).`);

  const committed = filtered.filter(d => bucketOf(d.status) === "committed").length;
  if (committed) out.push(`${committed} project${committed > 1 ? "s are" : " is"} deployed or ready to deploy.`);

  const backlog = filtered.filter(d => d.status === "Backlog").length;
  if (backlog) out.push(`${backlog} project${backlog > 1 ? "s remain" : " remains"} in the backlog and not yet committed.`);

  const q3 = filtered.filter(d => d.wq.includes("Q3 2026")).length;
  const q4 = filtered.filter(d => d.wq.includes("Q4 2026")).length;
  out.push(`Working-quarter load: ${q3} project${q3 > 1 ? "s" : ""} touch Q3 2026, ${q4} touch Q4 2026.`);

  const withGa = filtered.filter(d => d.gaTarget).length;
  if (withGa) out.push(`Only ${withGa} project${withGa > 1 ? "s have" : " has"} a committed GA target date set in Jira.`);

  return out;
}

function renderCallouts(filtered) {
  const items = state.customCallouts !== null
    ? state.customCallouts.split("\n").map(s => s.replace(/^[-•]\s*/, "").trim()).filter(Boolean)
    : generateCallouts(filtered);
  document.getElementById("calloutList").innerHTML = items.map(i => `<li>${i}</li>`).join("");
  document.getElementById("calloutReset").classList.toggle("hidden", state.customCallouts === null);
}

function renderBreakdown(filtered) {
  const container = document.getElementById("products");
  const shownProducts = PRODUCT_ORDER.filter(p => filtered.some(d => d.product === p));
  if (!shownProducts.length) {
    container.innerHTML = `<div class="empty-state">No projects match the current filters.</div>`;
    return;
  }
  container.innerHTML = shownProducts.map((p, idx) => {
    const rows = filtered.filter(d => d.product === p).sort((a, b) => a.name.localeCompare(b.name));
    return `
      <div class="product-section${idx > 0 ? " print-break" : ""}">
        <div class="product-name">${p} (${rows.length})</div>
        <table class="pb">
          <thead>
            <tr>
              <th class="col-project">Project</th>
              <th>Size</th>
              <th>Dev Target</th>
              <th>GA Target</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const meta = statusMeta(r.status);
              return `<tr>
                <td class="c-project"><a class="proj-link" href="https://alineops.atlassian.net/browse/${r.key}" target="_blank" rel="noopener" title="Open ${r.key} in Jira">${r.name}</a></td>
                <td class="c-size">${r.size || "—"}</td>
                <td class="c-target">${dateToQuarter(r.devTarget) || "—"}</td>
                <td class="c-target">${dateToQuarter(r.gaTarget) || "—"}</td>
                <td class="c-status"><span class="badge" style="background:${meta.fill};color:${meta.text}">${r.status}</span></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
  }).join("");
}

function renderProjectCount(filtered) {
  document.getElementById("projectCount").textContent =
    `${filtered.length} project${filtered.length === 1 ? "" : "s"}`;
  document.getElementById("clearAll").classList.toggle("hidden", !anyFilterActive());
}

function renderAll() {
  const filtered = getFiltered();
  renderSummaryCards(filtered);
  renderStatusMix(filtered);
  renderByQuarter(filtered);
  renderCallouts(filtered);
  renderBreakdown(filtered);
  renderProjectCount(filtered);
}

function onFilterChange() { renderAll(); }

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    state.tab = tab.dataset.tab;

    const active = showDash ? dash : brk;
    active.style.animation = "none";
    void active.offsetWidth;
    active.style.animation = "";
  };

function setViewedTime() {
  const now = new Date();
  const hh = now.getHours() % 12 || 12;
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ap = now.getHours() < 12 ? "AM" : "PM";
  document.getElementById("viewedLine").textContent = `Viewed: ${hh}:${mm} ${ap}`;
  document.getElementById("syncLine").textContent = `Jira: ${JIRA_SYNC} · ${DATA_SCOPE}`;
}

function svgToPngDataUrl(svgMarkup, pxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const ratio = img.naturalHeight / img.naturalWidth;
      const canvas = document.createElement("canvas");
      canvas.width = pxWidth;
      canvas.height = Math.round(pxWidth * ratio);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/png"));
    };
    img.onerror = reject;
    img.src = "data:image/svg+xml;base64," + btoa(svgMarkup);
  });
}

let _logoCache = null;
async function getBrandLogos() {
  if (!_logoCache) {
    _logoCache = {
      dark: await svgToPngDataUrl(ALINE_LOGO_DARK_SVG, 600),
      white: await svgToPngDataUrl(ALINE_LOGO_WHITE_SVG, 600),
    };
  }
  return _logoCache;
}

async function buildPptx() {
  const btn = document.getElementById("btnPptx");
  const origLabel = btn.textContent;
  btn.textContent = "Generating…";
  btn.disabled = true;

  try {
    const filtered = getFiltered();
    const logos = await getBrandLogos();
    const pres = new PptxGenJS();
    pres.defineLayout({ name: "ALINE_WIDE", width: 13.33, height: 7.5 });
    pres.layout = "ALINE_WIDE";

    pres.defineSlideMaster({
      title: CONTENT_MASTER,
      background: { color: "FFFFFF" },
      objects: [
        { image: { x: 0, y: 6.55, w: 13.33, h: 0.8, data: ALINE_FOOTER_RIBBON_PNG } },
        { image: { x: 0.9, y: 7.06, w: 0.97, h: 0.25, data: logos.white } },
        { text: { text: "© 2026 Aline", options: { x: 4.1, y: 7.0, w: 2.6, h: 0.25, align: "center", color: "FFFFFF", fontFace: ALINE_DECK.bodyFont, fontSize: 10 } } },
      ],
      slideNumber: { x: 12.4, y: 6.95, color: "FFFFFF", fontFace: ALINE_DECK.bodyFont, fontSize: 10 },
    });

    addTitleSlide(pres, filtered, logos);
    addDashboardSlide(pres, filtered);
    addCalloutsSlide(pres, filtered);
    addBreakdownSlides(pres, filtered);

    const qLabel = state.quarters.size ? [...state.quarters].join("-") : "All-Quarters";
    await pres.writeFile({ fileName: `SVP-Product-Report_${qLabel}.pptx` });
  } finally {
    btn.textContent = origLabel;
    btn.disabled = false;
  }
}

// Mirrors the deck's "Title Slide White Left" layout: white ground, dark wordmark
// top-left, title/subtitle lower-left, full-bleed brand graphic on the right.
function addTitleSlide(pres, filtered, logos) {
  const slide = pres.addSlide();
  slide.background = { color: "FFFFFF" };
  slide.addImage({ x: 5.26, y: 1.35, w: 8.06, h: 6.15, data: ALINE_HERO_PNG });
  slide.addImage({ x: 0.92, y: 1.21, w: 1.89, h: 0.49, data: logos.dark });
  slide.addText("SVP Product Report", {
    x: 0.92, y: 2.57, w: 4.2, h: 1.4, valign: "b",
    fontFace: ALINE_DECK.headFont, fontSize: 34, bold: true, color: PPTX_NAVY,
  });
  const qLabel = state.quarters.size ? [...state.quarters].join(" / ") : "Q3 2026 / Q4 2026";
  slide.addText(`${qLabel} · ${filtered.length} project${filtered.length === 1 ? "" : "s"}`, {
    x: 0.92, y: 4.05, w: 4.2, h: 0.5, fontFace: ALINE_DECK.bodyFont, fontSize: 16, color: PPTX_MUTED,
  });
  slide.addText(`Jira sync: ${JIRA_SYNC}`, {
    x: 0.92, y: 6.99, w: 4.2, h: 0.35, fontFace: ALINE_DECK.bodyFont, fontSize: 10, color: "9BA5B0",
  });
}

function addDashboardSlide(pres, filtered) {
  const slide = pres.addSlide({ masterName: CONTENT_MASTER });
  slide.addText("Dashboard Summary", { x: 0.5, y: 0.35, w: 12, h: 0.5, fontFace: ALINE_DECK.headFont, fontSize: 22, bold: true, color: PPTX_NAVY });

  // Summary stat cards — number in accent2 (purple), matching the deck's Statistics layout
  const total = filtered.length;
  const committed = filtered.filter(d => ["in_progress", "committed"].includes(bucketOf(d.status))).length;
  const underReview = filtered.filter(d => bucketOf(d.status) === "under_review").length;
  const early = filtered.filter(d => bucketOf(d.status) === "early").length;
  const cards = [
    { label: "ACTIVE PROJECTS", num: total, accent: ALINE_DECK.purple },
    { label: "COMMITTED / IN PROGRESS", num: committed, accent: ALINE_DECK.purple },
    { label: "UNDER REVIEW", num: underReview, accent: ALINE_DECK.purple },
    { label: "EARLY / BACKLOG", num: early, accent: ALINE_DECK.purple },
  ];
  const cardW = 2.9, cardGap = 0.25, startX = 0.5;
  cards.forEach((c, i) => {
    const x = startX + i * (cardW + cardGap);
    slide.addShape(pres.ShapeType.rect, { x, y: 1.0, w: cardW, h: 1.3, fill: { color: "FFFFFF" }, line: { color: PPTX_BORDER, width: 1 } });
    slide.addShape(pres.ShapeType.rect, { x, y: 1.0, w: cardW, h: 0.06, fill: { color: c.accent }, line: { type: "none" } });
    slide.addText(String(c.num), { x, y: 1.1, w: cardW, h: 0.65, align: "center", fontFace: ALINE_DECK.headFont, fontSize: 32, bold: true, color: c.accent });
    slide.addText(c.label, { x, y: 1.75, w: cardW, h: 0.4, align: "center", fontFace: ALINE_DECK.bodyFont, fontSize: 9, bold: true, color: PPTX_MUTED });
  });

  // Delivery status mix (stacked bar)
  slide.addText("DELIVERY STATUS MIX", { x: 0.5, y: 2.7, w: 8, h: 0.3, fontFace: ALINE_DECK.bodyFont, fontSize: 11, bold: true, color: PPTX_MUTED });
  const counts = BUCKETS.map(b => ({ ...b, count: filtered.filter(d => bucketOf(d.status) === b.key).length })).filter(b => b.count > 0);
  const barW = 12.3, barX = 0.5, barY = 3.05, barH = 0.55;
  const sum = counts.reduce((s, b) => s + b.count, 0) || 1;
  let cx = barX;
  counts.forEach(b => {
    const w = (b.count / sum) * barW;
    slide.addShape(pres.ShapeType.rect, { x: cx, y: barY, w, h: barH, fill: { color: b.color.replace("#", "") }, line: { type: "none" } });
    slide.addText(String(b.count), { x: cx, y: barY, w, h: barH, align: "center", valign: "middle", fontFace: ALINE_DECK.bodyFont, fontSize: 14, bold: true, color: "FFFFFF" });
    cx += w;
  });
  slide.addText(counts.map(b => `${b.label} (${b.count})`).join("     "), {
    x: barX, y: barY + barH + 0.15, w: barW, h: 0.35, fontFace: ALINE_DECK.bodyFont, fontSize: 10, color: PPTX_TEXT,
  });

  // By working quarter tiles
  slide.addText("BY WORKING QUARTER", { x: 0.5, y: 4.35, w: 6, h: 0.3, fontFace: ALINE_DECK.bodyFont, fontSize: 11, bold: true, color: PPTX_MUTED });
  SCOPE_QUARTERS.forEach((q, i) => {
    const count = filtered.filter(d => d.wq.includes(q)).length;
    const x = 0.5 + i * 1.9;
    slide.addShape(pres.ShapeType.roundRect, { x, y: 4.7, w: 1.7, h: 1.15, rectRadius: 0.08, fill: { color: PPTX_TEAL }, line: { type: "none" } });
    slide.addText(String(count), { x, y: 4.75, w: 1.7, h: 0.65, align: "center", fontFace: ALINE_DECK.headFont, fontSize: 26, bold: true, color: "FFFFFF" });
    slide.addText(`${q} PROJECTS`, { x, y: 5.35, w: 1.7, h: 0.4, align: "center", fontFace: ALINE_DECK.bodyFont, fontSize: 7, bold: true, color: "E3F3FA" });
  });
}

function addCalloutsSlide(pres, filtered) {
  const slide = pres.addSlide({ masterName: CONTENT_MASTER });
  slide.addText("Program Call-Outs", { x: 0.5, y: 0.35, w: 12, h: 0.5, fontFace: ALINE_DECK.headFont, fontSize: 22, bold: true, color: PPTX_NAVY });
  const items = state.customCallouts !== null
    ? state.customCallouts.split("\n").map(s => s.replace(/^[-•]\s*/, "").trim()).filter(Boolean)
    : generateCallouts(filtered);
  slide.addText(items.map(i => ({ text: i, options: { bullet: true, breakLine: true, paraSpaceAfter: 10 } })), {
    x: 0.6, y: 1.15, w: 12, h: 5.2, fontFace: ALINE_DECK.bodyFont, fontSize: 16, color: PPTX_TEXT, valign: "top",
  });
}

function addBreakdownSlides(pres, filtered) {
  const shownProducts = PRODUCT_ORDER.filter(p => filtered.some(d => d.product === p));
  shownProducts.forEach(p => {
    const rows = filtered.filter(d => d.product === p).sort((a, b) => a.name.localeCompare(b.name));
    const header = [
      { text: "Project", options: { bold: true, color: "FFFFFF", fill: { color: PPTX_NAVY }, fontSize: 10 } },
      { text: "Size", options: { bold: true, color: "FFFFFF", fill: { color: PPTX_NAVY }, fontSize: 10, align: "center" } },
      { text: "Dev Target", options: { bold: true, color: "FFFFFF", fill: { color: PPTX_NAVY }, fontSize: 10, align: "center" } },
      { text: "GA Target", options: { bold: true, color: "FFFFFF", fill: { color: PPTX_NAVY }, fontSize: 10, align: "center" } },
      { text: "Status", options: { bold: true, color: "FFFFFF", fill: { color: PPTX_NAVY }, fontSize: 10, align: "center" } },
    ];
    const rowsPerSlide = 10;
    for (let i = 0; i < rows.length; i += rowsPerSlide) {
      const chunk = rows.slice(i, i + rowsPerSlide);
      const slide = pres.addSlide({ masterName: CONTENT_MASTER });
      const title = i === 0 ? `${p} (${rows.length})` : `${p} (${rows.length}) — cont.`;
      slide.addText(title, { x: 0.5, y: 0.35, w: 12, h: 0.4, fontFace: ALINE_DECK.headFont, fontSize: 16, bold: true, color: PPTX_TEAL });
      const body = chunk.map((r, idx) => {
        const meta = statusMeta(r.status);
        const rowFill = idx % 2 === 0 ? "FFFFFF" : "EDF4F7";
        return [
          { text: r.name, options: { fontSize: 10, color: PPTX_TEXT, fill: { color: rowFill } } },
          { text: r.size || "—", options: { fontSize: 10, align: "center", color: "4A5568", fill: { color: rowFill } } },
          { text: dateToQuarter(r.devTarget) || "—", options: { fontSize: 10, align: "center", color: PPTX_TEAL, fill: { color: rowFill } } },
          { text: dateToQuarter(r.gaTarget) || "—", options: { fontSize: 10, align: "center", color: PPTX_TEAL, fill: { color: rowFill } } },
          { text: r.status, options: { fontSize: 9, bold: true, align: "center", color: meta.text.replace("#", ""), fill: { color: meta.fill.replace("#", "") } } },
        ];
      });
      slide.addTable([header, ...body], {
        x: 0.5, y: 0.9, w: 12.3,
        colW: [5.8, 1.2, 1.9, 1.9, 1.5],
        border: { type: "solid", color: PPTX_BORDER, pt: 0.5 },
        autoPage: false,
        valign: "middle",
      });
    }
  });
}

/* ============================================================
   Init
   ============================================================ */
function initFilters() {
  buildMultiSelect(document.getElementById("msQuarters"), "Quarters", ALL_QUARTERS, state.quarters);
  buildMultiSelect(document.getElementById("msProducts"), "Products", ALL_PRODUCTS, state.products);
  buildMultiSelect(document.getElementById("msStatuses"), "Statuses", ALL_STATUSES, state.statuses);
}

initFilters();
setViewedTime();
renderAll();
</script>
